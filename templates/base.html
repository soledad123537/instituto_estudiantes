<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capacitación</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="{{ url_for('cursos') }}">CAPACITACION</a>
  <div class="navbar-nav">
    <a class="nav-link" href="{{ url_for('estudiantes') }}">Estudiantes</a>
    <a class="nav-link" href="{{ url_for('cursos') }}">Cursos</a>
    <a class="nav-link" href="{{ url_for('instructores') }}">Instructores</a>
    <a class="nav-link" href="{{ url_for('inscripciones') }}">Inscripciones</a>
  </div>
</nav>
<div class="container mt-4">
  {% for m in get_flashed_messages() %}
  <div class="alert alert-info">{{ m }}</div>
  {% endfor %}
  {% block contenido %}{% endblock %}
</div>
</body>
</html>
