{% extends "base.html" %}
{% block contenido %}
<h1>{{ titulo }}</h1>
<form method="post" class="col-md-6">
  <div class="mb-3"><label class="form-label">Descripción</label>
    <input class="form-control" name="descripcion" value="{{ c.descripcion if c else '' }}" required></div>
  <div class="mb-3"><label class="form-label">Horas</label>
    <input class="form-control" type="number" min="1" name="horas" value="{{ c.horas if c else '' }}" required></div>
  <div class="mb-3"><label class="form-label">Costo (Bs)</label>
    <input class="form-control" type="number" step="0.01" min="0" name="costo" value="{{ c.costo if c else '' }}" required></div>
  <div class="mb-3"><label class="form-label">Instructor</label>
    <select class="form-select" name="instructor_id">
      <option value="">-- Sin instructor --</option>
      {% for i in instructores %}
      <option value="{{ i.id }}" {{ 'selected' if c and c.instructor_id == i.id }}>{{ i.nombre }}</option>
      {% endfor %}
    </select></div>
  <button class="btn btn-primary">Guardar</button>
  <a class="btn btn-secondary" href="{{ url_for('cursos') }}">Cancelar</a>
</form>
{% endblock %}
