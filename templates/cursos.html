{% extends "base.html" %}
{% block contenido %}
<h2>Módulo Cursos</h2>
<a class="btn" href="{{ url_for('nuevo_curso') }}">Nuevo</a>
<table>
<tr><th>ID</th><th>Descripción</th><th>Cantidad de horas</th><th>Acciones</th></tr>
{% for c in cursos %}
<tr><td>{{ c.id }}</td><td>{{ c.descripcion }}</td><td>{{ c.horas }}</td>
<td><a href="{{ url_for('editar_curso', id=c.id) }}">Editar</a>
<a href="{{ url_for('eliminar_curso', id=c.id) }}" onclick="return confirm('¿Eliminar?')">Eliminar</a></td></tr>
{% endfor %}
</table>
{% endblock %}
