{% extends "base.html" %}
{% block contenido %}
<h2>Editar Estudiante</h2>
<form method="post">
  <label>Nombre:</label><input type="text" name="nombre" value="{{ estudiante.nombre }}" required>
  <label>Apellidos:</label><input type="text" name="apellidos" value="{{ estudiante.apellidos }}" required>
  <label>Fecha de nacimiento:</label><input type="date" name="fecha_nacimiento" value="{{ estudiante.fecha_nacimiento or '' }}">
  <button type="submit">Guardar</button> <a href="{{ url_for('estudiantes') }}">Cancelar</a>
</form>
{% endblock %}
