{% extends "base.html" %}
{% block contenido %}
<h2>Módulo Estudiantes</h2>
<a class="btn" href="{{ url_for('nuevo_estudiante') }}">Nuevo</a>
<table>
<tr><th>ID</th><th>Nombre</th><th>Apellidos</th><th>Fecha nac.</th><th>Acciones</th></tr>
{% for e in estudiantes %}
<tr><td>{{ e.id }}</td><td>{{ e.nombre }}</td><td>{{ e.apellidos }}</td><td>{{ e.fecha_nacimiento or '' }}</td>
<td><a href="{{ url_for('editar_estudiante', id=e.id) }}">Editar</a>
<a href="{{ url_for('eliminar_estudiante', id=e.id) }}" onclick="return confirm('¿Eliminar?')">Eliminar</a></td></tr>
{% endfor %}
</table>
{% endblock %}
