{% extends "base.html" %}
{% block contenido %}
<h2>Módulo Inscripciones</h2>
<a class="btn" href="{{ url_for('nueva_inscripcion') }}">Nuevo</a>
<table>
<tr><th>ID</th><th>Fecha</th><th>Estudiante</th><th>Curso</th><th>Acciones</th></tr>
{% for i in inscripciones %}
<tr><td>{{ i.id }}</td><td>{{ i.fecha }}</td><td>{{ i.estudiante }}</td><td>{{ i.curso }}</td>
<td><a href="{{ url_for('editar_inscripcion', id=i.id) }}">Editar</a>
<a href="{{ url_for('eliminar_inscripcion', id=i.id) }}" onclick="return confirm('¿Eliminar?')">Eliminar</a></td></tr>
{% endfor %}
</table>
{% endblock %}
