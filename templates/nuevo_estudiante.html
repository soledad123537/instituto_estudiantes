{% extends "base.html" %}
{% block contenido %}
<h2>Nuevo Estudiante</h2>
<form method="post">
  <label>Nombre:</label><input type="text" name="nombre" required>
  <label>Apellidos:</label><input type="text" name="apellidos" required>
  <label>Fecha de nacimiento:</label><input type="date" name="fecha_nacimiento">
  <button type="submit">Guardar</button> <a href="{{ url_for('estudiantes') }}">Cancelar</a>
</form>
{% endblock %}
